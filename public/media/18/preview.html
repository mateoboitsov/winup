  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

cero.<\u002Fp>\n      <p style=\"margin:0;color:rgba(255,255,255,.72);font-size:19px;line-height:1.55;max-width:46ch;letter-spacing:0\">Partimos de un folio en blanco: rejilla, tipografía, sistema de color, portadillas de cada inmersión, tablas de datos técnicos, iconografía, ilustraciones batimétricas y maquetación bilingüe español–inglés. Todo el material fotográfico y de vídeo es propio, capturado en Isla Grosa, El Farallón y La Laja.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 clamp(24px,6vw,120px) clamp(56px,7vw,110px)\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:36px;margin-bottom:clamp(28px,3vw,44px)\">\n      <h2 style=\"margin:0;font-size:clamp(32px,4.6vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1\" data-reveal=\"1\">El sistema editorial<\u002Fh2>\n      <div style=\"color:rgba(255,255,255,.5);font-size:17px\">Arrastra para recorrer las páginas →<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sj-strip\" style=\"display:flex;gap:clamp(12px,1.5vw,24px);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px\">\n      <sc-for list=\"{{ spreads }}\" as=\"sp\" hint-placeholder-count=\"5\">\n        <figure style=\"margin:0;flex:0 0 auto;width:min(78vw,900px);scroll-snap-align:center;cursor:zoom-in\" sc-camel-on-click=\"{{ sp.open }}\">\n          <img src=\"{{ sp.src }}\" alt=\"{{ sp.label }}\" style=\"display:block;width:100%;height:auto;background:#111;border:1px solid rgba(255,255,255,.08)\">\n          <figcaption style=\"padding-top:14px;font-size:16px;color:rgba(255,255,255,.6)\">{{ sp.label }}<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 clamp(24px,6vw,120px) clamp(64px,9vw,120px)\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:36px;margin-bottom:clamp(28px,3vw,44px)\">\n      <h2 style=\"margin:0;font-size:clamp(32px,4.6vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1\" data-reveal=\"1\">Las 7 inmersiones<\u002Fh2>\n      <div style=\"color:rgba(255,255,255,.5);font-size:17px\">Elige una inmersión<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(28px,3vw,44px)\">\n      <sc-for list=\"{{ dives }}\" as=\"d\" hint-placeholder-count=\"7\">\n        <button type=\"button\" sc-camel-on-click=\"{{ d.select }}\" style=\"{{ d.chipStyle }}\">\n          <span style=\"opacity:.55;font-weight:600\">{{ d.num }}<\u002Fspan>\n          <span>{{ d.name }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,64px);align-items:start\">\n      <div>\n        <div style=\"font-size:15px;font-weight:600;letter-spacing:.14em;color:#D6F400;margin-bottom:14px\">{{ activeDive.kicker }}<\u002Fdiv>\n        <h3 style=\"margin:0 0 20px;font-size:clamp(28px,3.4vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.02\">{{ activeDive.name }}<\u002Fh3>\n        <p style=\"margin:0 0 26px;font-size:19px;line-height:1.55;color:rgba(255,255,255,.75);max-width:46ch\">{{ activeDive.body }}<\u002Fp>\n        <div style=\"display:flex;gap:36px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.12);padding-top:22px\">\n          <div>\n            <div style=\"font-size:15px;color:rgba(255,255,255,.5);margin-bottom:6px\">Profundidad<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700\">{{ activeDive.depth }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:15px;color:rgba(255,255,255,.5);margin-bottom:6px\">Nivel<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700\">{{ activeDive.level }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:15px;color:rgba(255,255,255,.5);margin-bottom:6px\">Páginas de la guía<\u002Fdiv>\n            <div style=\"font-size:22px;font-weight:700\">{{ activeDive.pages }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:clamp(12px,1.5vw,20px)\">\n        <sc-for list=\"{{ activeDive.images }}\" as=\"im\" hint-placeholder-count=\"2\">\n          <img src=\"{{ im.src }}\" alt=\"{{ im.alt }}\" sc-camel-on-click=\"{{ im.open }}\" style=\"display:block;width:100%;height:auto;border:1px solid rgba(255,255,255,.08);background:#111;cursor:zoom-in;transition:transform .5s ease,opacity .5s ease\" style-hover=\"transform:scale(1.012);opacity:.94\">\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 clamp(24px,6vw,120px) clamp(64px,9vw,120px)\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.1);padding-top:36px;margin-bottom:clamp(32px,4vw,56px)\">\n      <h2 style=\"margin:0;font-size:clamp(32px,4.6vw,72px);font-weight:800;letter-spacing:-.03em;line-height:1\" data-reveal=\"1\">Cómo hicimos la guía<\u002Fh2>\n      <div style=\"color:rgba(255,255,255,.5);font-size:17px\">Pulsa cada fase<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,64px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ steps }}\" as=\"step\" hint-placeholder-count=\"4\">\n          <button type=\"button\" sc-camel-on-click=\"{{ step.select }}\" style=\"{{ step.tabStyle }}\">\n            <span style=\"font-size:15px;font-weight:600;letter-spacing:.14em;opacity:.55\">{{ step.num }}<\u002Fspan>\n            <span style=\"font-size:clamp(20px,2vw,28px);font-weight:700;letter-spacing:-.02em;text-align:left\">{{ step.title }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <p style=\"margin:28px 0 0;font-size:19px;line-height:1.55;color:rgba(255,255,255,.75);max-width:44ch\">{{ activeStepBody }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;width:100%;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,.08)\">\n        <img src=\"{{ activeStepImage }}\" alt=\"{{ activeStepAlt }}\" sc-camel-on-click=\"{{ openStepImage }}\" style=\"display:block;width:100%;height:auto;cursor:zoom-in\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 clamp(24px,6vw,120px) clamp(80px,10vw,160px)\">\n    <div style=\"border-top:1px solid rgba(255,255,255,.1);padding-top:clamp(40px,5vw,72px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px\">\n      <div>\n        <div style=\"color:#D6F400;font-size:17px;font-weight:600;margin-bottom:18px\">Siguiente proyecto<\u002Fdiv>\n        <a href=\"#proyectos\" style=\"font-size:clamp(34px,5vw,80px);font-weight:800;letter-spacing:-.03em;color:#FFFFFF;line-height:1\" style-hover=\"color:#D6F400\">Ver todos los proyectos →<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"#contacto\" style=\"border:1px solid #D6F400;color:#D6F400;padding:16px 30px;font-size:18px;font-weight:600\" style-hover=\"background:#D6F400;color:#0A0A0A\">Cuéntanos tu proyecto<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:80;background:rgba(6,6,6,.96);display:flex;flex-direction:column;padding:20px clamp(16px,3vw,48px)\" sc-camel-on-click=\"{{ closeLightbox }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.7);font-size:16px;padding-bottom:14px\">\n        <span>{{ lightboxLabel }}<\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeLightbox }}\" style=\"background:transparent;border:0;color:#D6F400;font-size:24px;cursor:pointer;font-family:inherit\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,28px)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ prevLightbox }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,.25);color:#FFFFFF;width:48px;height:48px;font-size:20px;cursor:pointer;flex:0 0 auto;font-family:inherit\" style-hover=\"border-color:#D6F400;color:#D6F400\">←<\u002Fbutton>\n        <img src=\"{{ lightboxSrc }}\" alt=\"{{ lightboxLabel }}\" style=\"max-width:100%;max-height:100%;object-fit:contain\">\n        <button type=\"button\" sc-camel-on-click=\"{{ nextLightbox }}\" style=\"background:transparent;border:1px solid rgba(255,255,255,.25);color:#FFFFFF;width:48px;height:48px;font-size:20px;cursor:pointer;flex:0 0 auto;font-family:inherit\" style-hover=\"border-color:#D6F400;color:#D6F400\">→<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;columnasGaleria&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Galería&quot;}}\">\nconst PAGES = [\n  { src: \"uploads/IMG_0119.jpg\", label: \"Portada y créditos\" },\n  { src: \"uploads/IMG_0120.jpg\", label: \"Autores\" },\n  { src: \"uploads/IMG_0121.jpg\", label: \"San Javier, destino turístico\" },\n  { src: \"uploads/IMG_0122.jpg\", label: \"Zona de inmersiones · Isla Grosa y El Farallón\" },\n  { src: \"uploads/IMG_0123.jpg\", label: \"Mapa de inmersiones y tabla técnica\" },\n  { src: \"uploads/IMG_0124.jpg\", label: \"Buceo responsable y sostenible\" },\n  { src: \"uploads/IMG_0125.jpg\", label: \"Índice de las 7 inmersiones · portadilla Punta de León\" },\n  { src: \"uploads/IMG_0126.PNG\", label: \"Punta de León · el arco de Isla Grosa\" },\n  { src: \"uploads/IMG_0127.jpg\", label: \"La Gruta · buceando entre cormoranes\" },\n  { src: \"uploads/IMG_0128.jpg\", label: \"La Virgen · el pulmón de San Javier\" },\n  { src: \"uploads/IMG_0129.jpg\", label: \"El Gran Cañón · la vida oculta de las praderas\" },\n  { src: \"uploads/IMG_0130.jpg\", label: \"Los Callejones · explosión de color\" },\n  { src: \"uploads/IMG_0131.jpg\", label: \"Los Callejones · corales y nudibranquios\" },\n  { src: \"uploads/IMG_0132.jpg\", label: \"Los Callejones · abanicos de vida\" },\n  { src: \"uploads/IMG_0133.jpg\", label: \"La Laja · entre romanos y fenicios\" },\n  { src: \"uploads/IMG_0134.jpg\", label: \"La Laja · ilustración batimétrica\" },\n  { src: \"uploads/IMG_0135.jpg\", label: \"El Anfiteatro · formaciones de ensueño\" },\n  { src: \"uploads/IMG_0136.jpg\", label: \"El Anfiteatro · ilustración y barracudas\" },\n  { src: \"uploads/IMG_0137.jpg\", label: \"Grandes serránidos y pelágicos\" },\n  { src: \"uploads/IMG_0138.jpg\", label: \"Las Columnas · naufragios enigmáticos\" },\n  { src: \"uploads/IMG_0139.jpg\", label: \"Las Columnas · ilustración y pecio\" },\n  { src: \"uploads/IMG_0140.jpg\", label: \"Señales visuales de seguridad\" },\n  { src: \"uploads/IMG_0141.jpg\", label: \"Cubierta · 7 puntos de buceo\" },\n  { src: \"uploads/IMG_0142.jpg\", label: \"Punta de León · el arco de Isla Grosa\" }\n];\n\nconst DIVES = [\n  { num: \"01\", name: \"Punta de León\", kicker: \"EL ARCO DE ISLA GROSA\", depth: \"0–20 m\", level: \"Básico\", pages: \"18–23\",\n    body: \"El arco que atraviesa Isla Grosa: 120 metros de recorrido y 6 metros de profundidad máxima. La portadilla se resolvió a sangre, con la fotografía ocupando la doble página y el nombre de la inmersión en vertical sobre banda crema.\", idx: [23] },\n  { num: \"02\", name: \"La Gruta\", kicker: \"BUCEANDO ENTRE CORMORANES\", depth: \"0–14 m\", level: \"Avanzado\", pages: \"24–29\",\n    body: \"La colonia de cormorán moñudo de la cara este de Isla Grosa da nombre y contenido a esta inmersión. Texto científico revisado por biólogo, siempre en dos columnas: castellano arriba, inglés abajo, en menor cuerpo.\", idx: [8] },\n  { num: \"03\", name: \"La Virgen\", kicker: \"EL PULMÓN DE SAN JAVIER\", depth: \"0–18 m\", level: \"Básico\", pages: \"30–36\",\n    body: \"Las praderas de Posidonia y Cymodocea como eje del capítulo. Aquí entran las ilustraciones batimétricas: una vista mitad aire, mitad agua que sitúa al buceador antes de sumergirse, con su tabla de datos y QR al vídeo.\", idx: [9] },\n  { num: \"04\", name: \"Los Callejones\", kicker: \"EXPLOSIÓN DE COLOR\", depth: \"0–12 m\", level: \"Básico\", pages: \"37–43\",\n    body: \"El capítulo más cromático de la guía: comunidades esciáfilas, gorgonias y nudibranquios. Las fotos macro se imprimen a sangre y a página completa para que el color mande sobre el texto.\", idx: [11] },\n  { num: \"05\", name: \"La Laja\", kicker: \"ENTRE ROMANOS Y FENICIOS\", depth: \"2–20 m\", level: \"Básico\", pages: \"44–49\",\n    body: \"El Bajo de la Campana y el pecio fenicio más grande hallado en el Mediterráneo. Historia y biología comparten página con recortes tipo etiqueta rasgada para nombrar especies.\", idx: [14] },\n  { num: \"06\", name: \"El Anfiteatro\", kicker: \"FORMACIONES DE ENSUEÑO\", depth: \"14–17 m\", level: \"Básico\", pages: \"50–55\",\n    body: \"Un afloramiento rocoso en medio de la pradera. Fichas de grandes serránidos y pelágicos sobre fondo papel, con los peces recortados para poder identificarlos de un vistazo.\", idx: [16] },\n  { num: \"07\", name: \"Las Columnas\", kicker: \"NAUFRAGIOS ENIGMÁTICOS\", depth: \"24–27 m\", level: \"Avanzado\", pages: \"56–61\",\n    body: \"La inmersión más profunda de la guía, sobre la carga de un barco a 27 metros. Cierra el bloque de inmersiones y enlaza con el capítulo de seguridad y señales visuales.\", idx: [19] }\n];\n\nconst STEPS = [\n  { num: \"01\", title: \"Estructura\", body: \"Definimos el recorrido de las 65 páginas: introducción y territorio, zona de inmersiones, mapa general, buceo responsable, las 7 inmersiones y seguridad. Cada bloque tiene su propio pie de página con jerarquía y numeración.\", idx: 4 },\n  { num: \"02\", title: \"Sistema visual\", body: \"Rejilla a dos y tres columnas, azul institucional sobre papel, crema para portadillas y una cursiva para los subtítulos. Iconografía propia para nivel, recomendaciones, paisaje y fauna, más un código de color para las autorizaciones de la CARM.\", idx: 6 },\n  { num: \"03\", title: \"Fotografía e ilustración\", body: \"Todo el material es propio: fotografía y vídeo submarino en Isla Grosa, El Farallón y La Laja, más ilustraciones batimétricas dibujadas para cada punto de buceo y QR a los vídeos de cada inmersión.\", idx: 15 },\n  { num: \"04\", title: \"Edición bilingüe\", body: \"Maquetación en español e inglés con revisión científica de un biólogo. Cerramos con el bloque de seguridad —señales visuales fotografiadas expresamente— y la preparación de artes finales para imprenta y para digital.\", idx: 21 }\n];\n\nclass Component extends DCLogic {\n  state = { dive: 0, step: 0, lightbox: null };\n\n  componentDidMount() {\n    this.seen = new WeakSet();\n    this.onScroll = () => {\n      const doc = document.documentElement;\n      const max = doc.scrollHeight - window.innerHeight;\n      if (this.progressEl) this.progressEl.style.width = (max > 0 ? (window.scrollY / max) * 100 : 0) + \"%\";\n      if (this.heroEl) this.heroEl.style.transform = \"translate3d(0,\" + (window.scrollY * 0.18) + \"px,0)\";\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    this.onKey = (e) => {\n      if (this.state.lightbox === null) return;\n      if (e.key === \"Escape\") this.setState({ lightbox: null });\n      if (e.key === \"ArrowRight\") this.shift(1);\n      if (e.key === \"ArrowLeft\") this.shift(-1);\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) {\n          en.target.style.opacity = \"1\";\n          en.target.style.transform = \"none\";\n          this.io.unobserve(en.target);\n        }\n      });\n    }, { rootMargin: \"0px 0px -8% 0px\", threshold: 0.08 });\n    this.observe();\n  }\n\n  componentDidUpdate() { this.observe(); }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this.onScroll);\n    window.removeEventListener(\"keydown\", this.onKey);\n    if (this.io) this.io.disconnect();\n  }\n\n  observe() {\n    if (!this.io) return;\n    document.querySelectorAll(\"[data-reveal]\").forEach((el) => {\n      if (this.seen.has(el)) return;\n      this.seen.add(el);\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(26px)\";\n      el.style.transition = \"opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1)\";\n      this.io.observe(el);\n    });\n  }\n\n  shift(d) {\n    const n = PAGES.length;\n    this.setState((s) => ({ lightbox: ((s.lightbox + d) % n + n) % n }));\n  }\n\n  renderVals() {\n    const cols = Math.max(2, Math.min(4, parseInt(this.props.columnasGaleria ?? 3, 10) || 3));\n    const open = (i) => () => this.setState({ lightbox: i });\n    const activeDive = DIVES[this.state.dive];\n    const step = STEPS[this.state.step];\n\n    return {\n      progressRef: (el) => { this.progressEl = el; },\n      heroRef: (el) => { this.heroEl = el; },\n\n      spreads: [0, 1, 2, 3, 5].map((i) => ({ src: PAGES[i].src, label: PAGES[i].label, open: open(i) })),\n\n      dives: DIVES.map((d, i) => ({\n        num: d.num,\n        name: d.name,\n        select: () => this.setState({ dive: i }),\n        chipStyle: [\n          \"display:flex;align-items:center;gap:10px;padding:12px 20px;font-size:17px;font-weight:500;cursor:pointer;font-family:inherit\",\n          \"border:1px solid \" + (i === this.state.dive ? \"#D6F400\" : \"rgba(255,255,255,.18)\"),\n          \"background:\" + (i === this.state.dive ? \"#D6F400\" : \"transparent\"),\n          \"color:\" + (i === this.state.dive ? \"#0A0A0A\" : \"#FFFFFF\"),\n          \"transition:border-color .2s ease,background .2s ease,color .2s ease\"\n        ].join(\";\")\n      })),\n\n      activeDive: {\n        name: activeDive.name,\n        kicker: activeDive.kicker,\n        body: activeDive.body,\n        depth: activeDive.depth,\n        level: activeDive.level,\n        pages: activeDive.pages,\n        images: activeDive.idx.map((i) => ({ src: PAGES[i].src, alt: PAGES[i].label, open: open(i) }))\n      },\n\n      steps: STEPS.map((s, i) => ({\n        num: s.num,\n        title: s.title,\n        select: () => this.setState({ step: i }),\n        tabStyle: [\n          \"display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:100%;cursor:pointer\",\n          \"background:transparent;border:0;border-top:1px solid rgba(255,255,255,.12);padding:22px 0;font-family:inherit\",\n          \"transition:opacity .25s ease\",\n          i === this.state.step ? \"color:#D6F400;opacity:1\" : \"color:#FFFFFF;opacity:.5\"\n        ].join(\";\")\n      })),\n      activeStepBody: step.body,\n      activeStepImage: PAGES[step.idx].src,\n      activeStepAlt: PAGES[step.idx].label,\n      openStepImage: open(step.idx),\n\n      photos: PAGES.map((p, i) => ({ src: p.src, label: p.label, open: open(i) })),\n      galleryGridStyle: \"display:grid;grid-auto-flow:dense;grid-template-columns:repeat(\" + cols + \",1fr);gap:clamp(10px,1.2vw,20px)\",\n\n      lightboxOpen: this.state.lightbox !== null,\n      lightboxSrc: this.state.lightbox !== null ? PAGES[this.state.lightbox].src : \"\",\n      lightboxLabel: this.state.lightbox !== null ? PAGES[this.state.lightbox].label : \"\",\n      closeLightbox: () => this.setState({ lightbox: null }),\n      prevLightbox: (e) => { e.stopPropagation(); this.shift(-1); },\n      nextLightbox: (e) => { e.stopPropagation(); this.shift(1); }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
